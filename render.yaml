services:
  - type: web
    name: travel-planner-ai-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: API_NINJAS_KEY
        sync: false
      - key: avaiation_access_key
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
